<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Editor de Visual Novel — Protótipo</title>
    <!--
      CSP restritiva: nenhum recurso externo é permitido (R3 — tudo local).
      "blob:" em img-src permite exibir imagens importadas do computador
      do escritor via URL.createObjectURL, sem sair da máquina.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
